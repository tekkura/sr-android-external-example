name: 'Build'
description: 'Combines openjdk17 install, setup-gradle, and a Gradle invocation into one'

runs:
  using: "composite"
  steps:
  - name: set up JDK
    uses: actions/setup-java@v4.2.1
    with:
      java-version: '17.0'
      distribution: 'temurin'
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v3.3.2

  - name: Build with Gradle
    run: ./gradlew assembleDebug
    shell: bash
